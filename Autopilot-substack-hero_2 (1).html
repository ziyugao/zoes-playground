<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autopilot — Get insights on stock market</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="https://www.figma.com/api/mcp/asset/cfe39be2-76f9-4f03-8e42-295fddf5aa0b.png">
<link rel="preload" as="image" href="https://www.figma.com/api/mcp/asset/a5061d0f-b9be-4862-a4a1-6ac43c4827d7.png">
<link rel="preload" as="image" href="https://www.figma.com/api/mcp/asset/40c9ae14-ba33-47be-9246-f85a8fa88f04.png">
<link rel="preload" as="image" href="https://www.figma.com/api/mcp/asset/d8ddcf93-6660-43d4-be40-928542d4d8c3.png">
<link rel="preload" as="image" href="https://www.figma.com/api/mcp/asset/2dbf3331-fb14-43f0-8e7e-7dc7fb5ba5e0.png">
<link rel="preload" as="image" href="https://www.figma.com/api/mcp/asset/dd80d02a-d1ae-4fd1-9a90-82cf840a24a6.png">
<link rel="preload" as="image" href="https://www.figma.com/api/mcp/asset/a0324244-b35b-4278-b59d-2e42e6b67a80.png">
<link rel="preload" as="image" href="https://www.figma.com/api/mcp/asset/936bb516-537b-41c1-83fe-209b767ce7c5.png">
<style>
  :root {
    --bg-page: #fcfcfc;
    --bg-frame: #f6f6f7;
    --ink: #0d0d0d;
    --ink-72: rgba(13, 13, 13, 0.72);
    --ink-65: rgba(13, 13, 13, 0.65);
    --card-border: rgba(18, 18, 18, 0.04);
    --card-text: #f6f6f6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg-page);
    font-family: 'Satoshi', -apple-system, sans-serif;
    overflow: hidden;
  }

  /* ---- scale-to-fit stage ---- */
  .viewport {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage {
    width: 1440px;
    height: 877px;
    flex: none;
    transform-origin: center center;
  }

  .frame {
    position: relative;
    width: 1440px;
    height: 877px;
    background: var(--bg-frame);
    border-radius: 40px;
    overflow: hidden;
  }

  /* ---- nav ---- */
  .nav {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: flex-end;
    padding: 32px 40px;
    z-index: 6;
  }
  .nav img {
    width: 24px; height: 24px;
    display: block;
    cursor: pointer;
    opacity: 0.9;
  }

  /* ---- radial glow behind hero text ---- */
  .glow {
    position: absolute;
    inset: 88px 0 -10% 0;
    z-index: 3;
    pointer-events: none;
    background: radial-gradient(490px 278px at 720px 451px,
      rgba(246,246,247,0.92) 0%,
      rgba(246,246,247,0.75) 55%,
      rgba(246,246,247,0.30) 80%,
      rgba(246,246,247,0) 100%);
  }

  /* ---- hero content ---- */
  .hero {
    position: absolute;
    left: 293px;
    top: 167px; /* 88 nav + 79 */
    width: 848px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 27px;
    z-index: 4;
    opacity: 0;
  }
  .stage.play .hero {
    animation: heroIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
  }
  @keyframes heroIn {
    from { opacity: 0; transform: translateY(24px); filter: blur(10px); }
    to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
  }

  .hero .heading {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .hero .logo {
    width: 40px; height: 40px;
    object-fit: cover;
  }
  .hero h1 {
    font-size: 56px;
    font-weight: 500;
    letter-spacing: -2.912px;
    line-height: 84.86px;
    color: var(--ink);
    text-align: center;
    white-space: nowrap;
  }
  .hero .sub {
    max-width: 577px;
    padding: 0 15.77px;
    font-size: 20px;
    line-height: 28.8px;
    color: var(--ink-72);
    text-align: center;
  }

  /* ---- email pill ---- */
  .pill {
    width: 340px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #121212;
    border: 1px solid rgba(18, 18, 18, 0.08);
    border-radius: 999px;
    padding: 12px 12px 12px 24px;
  }
  .pill input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 20px;
    letter-spacing: -0.4px;
    color: #f6f6f6;
  }
  .pill input::placeholder { color: #b0b0b0; }
  .pill button {
    flex: none;
    height: 45px;
    padding: 9px 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f6f6f6;
    color: #0c0c0c;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 9999px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.32px;
    cursor: pointer;
    box-shadow: inset 1px 1px 4px -2px #fff;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .pill button:hover  { transform: scale(1.04); }
  .pill button:active { transform: scale(0.97); }

  .social-proof {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 14px;
    line-height: 14px;
    letter-spacing: -0.1px;
    color: var(--ink-65);
  }
  .social-proof img { width: 14px; height: 14px; display: block; }

  /* ---- cards ---- */
  .card {
    position: absolute;
    z-index: 2;
    will-change: transform;
  }
  .card-entrance {
    opacity: 0;
    transform: translate(var(--dx, 0px), var(--dy, 0px)) scale(0.4);
  }
  .stage.play .card-entrance {
    animation: spread 1.25s cubic-bezier(0.22, 1.18, 0.36, 1) var(--delay, 0s) forwards;
  }
  @keyframes spread {
    from { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.4); }
    30%  { opacity: 1; }
    to   { opacity: 1; transform: translate(0, 0) scale(1); }
  }

  .card-body {
    position: relative;
    background: #fff;
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 10px;
    box-shadow:
      0 8px 16px rgba(18, 18, 18, 0.08),
      0 16px 32px rgba(18, 18, 18, 0.08),
      inset 0 0 0 1px #fafafa;
  }
  .card-body.shadow-soft {
    box-shadow:
      0 0 0 1px rgba(18, 18, 18, 0.04),
      0 1px 2px rgba(18, 18, 18, 0.04),
      inset 0 0.75px 0 rgba(238, 238, 238, 0.12);
  }
  .card-body.shadow-dark {
    box-shadow:
      0 4px 8px rgba(0, 0, 0, 0.10),
      0 8px 16px rgba(0, 0, 0, 0.32);
  }

  .card-media {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: #e9e9ea; /* placeholder tone while cover decodes */
  }
  .card-media.s180 { width: 180px; height: 180px; }
  .card-media.s220 { width: 220px; height: 220px; }
  .card-media > img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .card-media .scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      rgba(0,0,0,0.2) 0%,
      rgba(0,0,0,0) 22.556%,
      rgba(0,0,0,0) 75.476%,
      rgba(0,0,0,0.2) 100%);
  }
  .card-media .label {
    position: absolute;
    top: 12px; left: 12px; right: 12px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.8px;
    line-height: 1.2;
    color: var(--card-text);
    font-feature-settings: "lnum" 1, "tnum" 1;
  }

  /* card positions — Main area offset by 88px nav */
  .card.trump   { left: -24px;  top: 60px;  }  /* -28 + 88 */
  .card.gpt-top { left: 855px;  top: -132px; } /* -220 + 88 */
  .card.leopold { left: 1235px; top: 177px; }  /* 89 + 88 */
  .card.buffett { left: 94px;   top: 434px; }  /* 346 + 88 */
  .card.pelosi  { left: 703px;  top: 589px; }  /* 501 + 88 */
  .card.gpt     { left: 1040px; top: 508px; }  /* 420 + 88 */
  .card.nvidia  { left: 369px;  top: 710px; }  /* 622 + 88 */

  /* ---- edge fades (above cards) ---- */
  .fade-bottom, .fade-top {
    position: absolute;
    left: 0; right: 0;
    z-index: 5;
    pointer-events: none;
  }
  .fade-bottom {
    bottom: 0;
    height: 88px;
    background: linear-gradient(to top,
      #fcfcfc 0%, rgba(246,246,247,0.6) 40%, rgba(246,246,247,0) 100%);
  }
  .fade-top {
    top: 0;
    height: 56px;
    background: linear-gradient(to bottom,
      #fcfcfc 0%, rgba(246,246,247,0.6) 40%, rgba(246,246,247,0) 100%);
  }
</style>
</head>
<body>
<div class="viewport">
  <div class="stage" id="stage">
    <div class="frame">

      <div class="glow"></div>

      <nav class="nav">
        <img src="https://www.figma.com/api/mcp/asset/27b4d228-8549-4021-b8a7-bcdd1a106593.svg" alt="Close">
      </nav>

      <!-- hero -->
      <div class="hero">
        <div class="heading">
          <img class="logo" src="https://www.figma.com/api/mcp/asset/936bb516-537b-41c1-83fe-209b767ce7c5.png" alt="Autopilot">
          <h1>Get insights on stock market</h1>
        </div>
        <p class="sub">From politicians to hedge fund managers, Autopilot lets you copy the portfolios of the market&rsquo;s best-connected investors.</p>
        <form class="pill" onsubmit="return false">
          <input type="email" placeholder="Enter your email" aria-label="Email address">
          <button type="submit">Subscribe</button>
        </form>
        <div class="social-proof">
          <span>Over 100k+ subscribers</span>
          <img src="https://www.figma.com/api/mcp/asset/25c23548-9989-43ef-a741-4d9d7d4cd291.svg" alt="Verified">
        </div>
      </div>

      <!-- cards -->
      <div class="card trump" data-depth="1.2">
        <div class="card-entrance" style="--delay: .04s">
          <div class="card-body shadow-soft">
            <div class="card-media s220">
              <img src="https://www.figma.com/api/mcp/asset/cfe39be2-76f9-4f03-8e42-295fddf5aa0b.png" alt="">
              <div class="scrim"></div>
              <div class="label">Trump&rsquo;s Donor Portfolio</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card gpt-top" data-depth="0.7">
        <div class="card-entrance" style="--delay: .12s">
          <div class="card-body shadow-soft">
            <div class="card-media s220">
              <img src="https://www.figma.com/api/mcp/asset/a5061d0f-b9be-4862-a4a1-6ac43c4827d7.png" alt="">
              <div class="scrim"></div>
              <div class="label">GPT Portfolio</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card leopold" data-depth="1.0">
        <div class="card-entrance" style="--delay: .08s">
          <div class="card-body">
            <div class="card-media s220">
              <img src="https://www.figma.com/api/mcp/asset/40c9ae14-ba33-47be-9246-f85a8fa88f04.png" alt="">
              <div class="scrim"></div>
              <div class="label">Leopold Aschenbrenner Tracker</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card buffett" data-depth="0.85">
        <div class="card-entrance" style="--delay: 0s">
          <div class="card-body">
            <div class="card-media s180">
              <img src="https://www.figma.com/api/mcp/asset/d8ddcf93-6660-43d4-be40-928542d4d8c3.png" alt="Buffett Tracker">
            </div>
          </div>
        </div>
      </div>

      <div class="card pelosi" data-depth="1.35">
        <div class="card-entrance" style="--delay: .06s">
          <div class="card-body shadow-dark">
            <div class="card-media s220">
              <img src="https://www.figma.com/api/mcp/asset/2dbf3331-fb14-43f0-8e7e-7dc7fb5ba5e0.png" alt="Pelosi Tracker">
            </div>
          </div>
        </div>
      </div>

      <div class="card gpt" data-depth="0.6">
        <div class="card-entrance" style="--delay: .1s">
          <div class="card-body">
            <div class="card-media s180">
              <img src="https://www.figma.com/api/mcp/asset/dd80d02a-d1ae-4fd1-9a90-82cf840a24a6.png" alt="">
              <div class="scrim"></div>
              <div class="label">GPT Portfolio</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card nvidia" data-depth="0.95">
        <div class="card-entrance" style="--delay: .14s">
          <div class="card-body">
            <div class="card-media s180">
              <img src="https://www.figma.com/api/mcp/asset/a0324244-b35b-4278-b59d-2e42e6b67a80.png" alt="">
              <div class="scrim"></div>
              <div class="label">Nvidia Tracker</div>
            </div>
          </div>
        </div>
      </div>

      <div class="fade-top"></div>
      <div class="fade-bottom"></div>

    </div>
  </div>
</div>

<script>
(function () {
  var STAGE_W = 1440, STAGE_H = 877;
  var stage = document.getElementById('stage');
  var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));

  /* ---- scale stage to fit viewport ---- */
  function fit() {
    var s = Math.min(window.innerWidth / (STAGE_W + 32), window.innerHeight / (STAGE_H + 32), 1);
    stage.style.transform = 'scale(' + s + ')';
  }
  fit();
  window.addEventListener('resize', fit);

  /* ---- entrance: spread from center ---- */
  var cx = STAGE_W / 2, cy = STAGE_H / 2;
  cards.forEach(function (card) {
    var inner = card.querySelector('.card-entrance');
    var body = card.querySelector('.card-body');
    var cardCx = card.offsetLeft + body.offsetWidth / 2;
    var cardCy = card.offsetTop + body.offsetHeight / 2;
    inner.style.setProperty('--dx', (cx - cardCx) + 'px');
    inner.style.setProperty('--dy', (cy - cardCy) + 'px');
  });

  /* hold the entrance until every image has decoded, so frames and
     covers arrive together (2.5s safety timeout in case one stalls) */
  var imgs = Array.prototype.slice.call(document.querySelectorAll('img'));
  var pending = imgs.length;
  var started = false;

  function start() {
    if (started) return;
    started = true;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        stage.classList.add('play');
      });
    });
  }
  function done() {
    pending--;
    if (pending <= 0) start();
  }
  imgs.forEach(function (img) {
    if (img.complete && img.naturalWidth > 0) { done(); return; }
    img.addEventListener('load', done);
    img.addEventListener('error', done);
  });
  if (pending <= 0) start();
  setTimeout(start, 2500);

  /* ---- subtle mouse parallax ---- */
  var targetX = 0, targetY = 0, curX = 0, curY = 0;
  var STRENGTH = 14; /* max px shift at depth 1 */

  window.addEventListener('mousemove', function (e) {
    targetX = (e.clientX / window.innerWidth) * 2 - 1;   /* -1..1 */
    targetY = (e.clientY / window.innerHeight) * 2 - 1;
  });

  function tick() {
    curX += (targetX - curX) * 0.06;
    curY += (targetY - curY) * 0.06;
    cards.forEach(function (card) {
      var d = parseFloat(card.dataset.depth) || 1;
      card.style.transform =
        'translate3d(' + (-curX * STRENGTH * d).toFixed(2) + 'px,' +
                         (-curY * STRENGTH * d).toFixed(2) + 'px, 0)';
    });
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
