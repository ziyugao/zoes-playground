<style>
  /* 8px base grid throughout: every spacing value is a multiple of 8 */
  :root {
    --pad: 24px;
    --pad-x: var(--pad); /* horizontal page margin; widens on large screens */
    --radius: 24px;
    --ink: #0d0d0d;
    --ink-60: rgba(13, 13, 13, 0.6);
    --ink-40: rgba(13, 13, 13, 0.4);
    --bg: #f6f6f7;
    --line: rgba(13, 13, 13, 0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Satoshi", system-ui, sans-serif;
    padding: var(--pad);
  }

  .lib-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--pad) var(--pad-x);
  }

  .lib-header h1 {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.48px;
  }

  .lib-avatar-wrap {
    position: relative;
    display: inline-flex;
    cursor: pointer;
  }

  .lib-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: block;
  }

  .lib-avatar-wrap:hover .lib-avatar {
    animation: avatarShake 0.4s ease-in-out infinite;
  }

  @keyframes avatarShake {
    0%, 100% { transform: rotate(-8deg); }
    50%      { transform: rotate(8deg); }
  }

  .hi-bubble {
    position: absolute;
    left: calc(100% + 10px);
    top: 50%;
    background: #0b93f6;
    color: #fff;
    font: 400 13px/1 "Satoshi", sans-serif;
    letter-spacing: -0.1px;
    padding: 8px 14px;
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transform: translateY(-50%) scale(0);
    transform-origin: left bottom;
    transition: opacity 0.25s ease, transform 0.45s cubic-bezier(0.32, 1.28, 0.32, 1);
  }

  .lib-avatar-wrap:hover .hi-bubble {
    opacity: 1;
    transform: translateY(-50%) scale(1);
  }

  /* ---------- Balloon overlay (avatar click) ---------- */

  .balloon-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(245, 245, 246, 0.55);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .balloon-overlay.in { opacity: 1; }

  .balloon-overlay iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: transparent;
  }

  .balloon-hint {
    position: absolute;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%);
    font: 400 13px/1 "Satoshi", sans-serif;
    letter-spacing: -0.1px;
    color: rgba(13, 13, 13, 0.45);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease 0.9s;
  }
  .balloon-overlay.in .balloon-hint { opacity: 1; }
  .balloon-overlay.popped .balloon-hint { opacity: 0; transition-delay: 0s; }

  .balloon-close {
    position: absolute;
    top: 20px;
    right: 24px;
    width: 40px;
    height: 40px;

    backdrop-filter: blur(8px);

    outline: none;

  .add-row input:focus { border-color: rgba(13, 13, 13, 0.35); background: #fff; }

  .add-go {

    border: none;
    border-radius: 10px;
    background: var(--ink);
    color: #f1f2f3;
    font: 400 13px/1 "Satoshi", sans-serif;
    cursor: pointer;
  }
  .add-file {
    margin-top: 10px;
    padding: 0;
    border: none;
    background: none;
    font: 400 12px/1 "Satoshi", sans-serif;
    color: var(--ink-40);
    cursor: pointer;
  }
  .add-file:hover { color: var(--ink); }

  .lib-edit {
    height: 40px;
    padding: 0 16px;
    border-radius: 999px;
    border: 1px solid rgba(13, 13, 13, 0.16);
    background: transparent;
    color: var(--ink);
    font: 400 14px/1 "Satoshi", sans-serif;
    letter-spacing: -0.14px;
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(0.32, 1.28, 0.32, 1), background 0.2s ease;

  .lib-edit:hover { background: rgba(13, 13, 13, 0.05); transform: scale(1.04); }
  .lib-edit.on { background: var(--ink); border-color: var(--ink); color: #f1f2f3; }

  .lib-add {
    height: 40px;
    padding: 0 16px;
    border-radius: 999px;
    border: none;
    background: var(--ink);
    color: #f1f2f3;
    font: 400 14px/1 "Satoshi", sans-serif;
    letter-spacing: -0.14px;
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(0.32, 1.28, 0.32, 1), filter 0.2s ease;
  }
  .lib-add:hover { transform: scale(1.04); filter: brightness(1.25); }

  /* Segmented control (Pilot Portal DS 40:4565, light variant) */
  .filters-row { padding: 0 var(--pad-x) var(--pad); }

  .filters {
    display: inline-flex;
    gap: 10px;
    padding: 4px;
    border-radius: 10px;
    background: #ffffff;
    border: 0.5px solid rgba(13, 13, 13, 0.08);
    box-shadow:
      0 1px 3px rgba(11, 19, 36, 0.1),
      inset 0 -1px 0 rgba(0, 0, 0, 0.06);
  }

  .filter-btn {
    padding: 4px 12px;
    border-radius: 6px;
    border: 0.5px solid transparent;
    background: transparent;
    font: 500 12px/1.2 "Satoshi", sans-serif;
    letter-spacing: -0.48px;
    font-feature-settings: "lnum" 1, "tnum" 1;
    color: #6d6d6d;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .filter-btn:hover { color: var(--ink); }
  .filter-btn.active {
    background: var(--ink);
    border-color: var(--ink);
    color: #f6f6f6;
    box-shadow:
      0 1px 2px rgba(0, 0, 0, 0.2),
      inset 0 0.75px 0 rgba(250, 250, 250, 0.12);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--pad);
    padding: var(--pad) var(--pad-x);
  }

  /* Figma 560:255 — ≥280px side margins on wide web (1440px+) */
  @media (min-width: 1440px) {
    :root { --pad-x: calc(280px - var(--pad)); } /* body pad + this = 280px total */
  }

  /* Chromeless cards: title row + live preview, no surface box */
  .card { color: inherit; }

  /* Tag sits on the left at rest; the title crossfades in over it on hover */
  .card-title {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: baseline;
    gap: 8px;
    padding: 0 8px 16px;
  }
  .card-title h2,
  .card-title .card-tag { grid-column: 1; grid-row: 1; }
  .card-actions {
    grid-column: 2;
    grid-row: 1;
    justify-self: end;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .card-title h2 {
    /* same type as the tag on the right */
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    padding: 2px 8px;
    margin-left: -8px;
    border-radius: 6px;
    cursor: text;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  .card-title h2 {
    opacity: 0;
    transition: opacity 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .card:hover .card-title h2,
  .card-title:focus-within h2 { opacity: 1; }

  /* hover: hint that the title is editable */
  .card-title h2:hover { background: rgba(13, 13, 13, 0.06); }
  .card-title h2:focus {
    outline: none;
    background: #fff;
    box-shadow: 0 0 0 1px rgba(13, 13, 13, 0.15);
    text-overflow: clip;
  }

  .card-tag,
  .card-remove {
    font-size: 12px;
    font-weight: 400;
    color: var(--ink-40);
    white-space: nowrap;
  }

  .card-tag {
    padding: 2px 8px;
    margin-left: -8px;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: opacity 0.2s ease;
  }
  .card:hover .card-tag,
  .card-title:focus-within .card-tag { opacity: 0; }

  .card-remove {
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    font-family: inherit;
  }
  .card-remove:hover { color: var(--ink); }

  /* Copy code: rides in with the title on hover, steps aside in edit mode */
  .card-copy {
    font: 400 12px/1 "Satoshi", sans-serif;
    color: var(--ink-40);
    background: none;
    border: none;
    padding: 2px 0;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s ease, color 0.2s ease;
  }
  .card:hover .card-copy { opacity: 1; }
  .card-copy:hover { color: var(--ink); }
  body.editing .card-copy { display: none; }

  /* Attach source to a card that's only a recording */
  .card-attach {
    font: 400 12px/1 "Satoshi", sans-serif;
    color: var(--ink-40);
    background: none;
    border: none;
    padding: 2px 0;
    cursor: pointer;
    display: none;
    transition: color 0.2s ease;
  }
  .card-attach:hover { color: var(--ink); }
  body.editing .card-attach { display: inline; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    z-index: 300;
    transform: translate(-50%, 12px);
    padding: 10px 18px;
    border-radius: 999px;
    background: var(--ink);
    color: #f6f6f7;
    font: 400 13px/1 "Satoshi", sans-serif;
    letter-spacing: -0.13px;
    box-shadow: 0 8px 24px rgba(13, 13, 13, 0.18);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.45s cubic-bezier(0.32, 1.28, 0.32, 1);
  }
  .toast.in { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Edit mode: drag to rearrange, Remove appears ---------- */

  /* Remove only shows while editing; the tag takes its place at rest */
  .card-remove { display: none; }
  body.editing .card-removable .card-tag { display: none; }
  body.editing .card-remove { display: inline; }

  body.editing .card {
    cursor: grab;
    border-radius: 14px;
    outline: 1px dashed rgba(13, 13, 13, 0.18);
    outline-offset: 8px;
  }
  /* live previews swallow drags, so freeze them while rearranging */
  body.editing .preview { pointer-events: none; }
  body.editing .card h2 { cursor: text; }

  .card.dragging {
    opacity: 0.4;
    cursor: grabbing;
    outline-style: solid;
    outline-color: var(--ink);
  }

  /* The preview IS the card surface — 24px radius, live to hover */
  .preview {
    position: relative;
    aspect-ratio: 16 / 10;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    overflow: hidden;
    background: #e9e9ec;
    box-shadow: 0 2px 8px rgba(13, 13, 13, 0.04);
  }

  /* 10% black wash on card hover; pointer-events pass through to the mini mockup */
  .preview::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.1);
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
    z-index: 1;
  }
  .card:hover .preview::after { opacity: 1; }

  .preview iframe {
    position: absolute;
    top: 0; left: 0;
    width: 1440px;
    height: 900px;
    border: 0;
    transform-origin: top left;
    /* live: hover the mini mockup and its states respond */
  }

  .preview video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #0c0c0c;
    pointer-events: none;   /* clicks land on the card */
  }

teY(-50%);\n    z-index: 20;\n    display: flex;\n    flex-direction: column;\n    gap: 8px;\n    padding: 14px;\n    border-radius: 18px;\n    background: rgba(18, 18, 21, 0.72);\n    border: 1px solid rgba(255, 255, 255, 0.14);\n    backdrop-filter: blur(12px);\n    -webkit-backdrop-filter: blur(12px);\n  }\n\n  .switcher-title {\n    font: 500 11px/1 \"Satoshi\", sans-serif;\n    letter-spacing: 0.04em;\n    color: rgba(255,255,255,0.6);\n    padding: 0 2px 2px;\n  }\n\n  .sw-btn {\n    font: 400 13px/1 \"Satoshi\", sans-serif;\n    letter-spacing: -0.13px;\n    color: #f1f2f3;\n    background: transparent;\n    border: 1px solid rgba(255,255,255,0.18);\n    border-radius: 999px;\n    padding: 9px 14px;\n    cursor: pointer;\n    white-space: nowrap;\n    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;\n  }\n  .sw-btn:hover { background: rgba(255,255,255,0.08); }\n  .sw-btn.active { background: #f1f2f3; color: #0d0d0d; border-color: #f1f2f3; }\n\n  body:is(.v2, .v3) .switcher {\n    background: rgba(255, 255, 255, 0.8);\n    border-color: rgba(13, 13, 13, 0.12);\n  }\n  body:is(.v2, .v3) .switcher-title { color: rgba(13,13,13,0.55); }\n  body:is(.v2, .v3) .sw-btn { color: #0d0d0d; border-color: rgba(13,13,13,0.2); }\n  body:is(.v2, .v3) .sw-btn:hover { background: rgba(13,13,13,0.06); }\n  body:is(.v2, .v3) .sw-btn.active { background: #0d0d0d; color: #f1f2f3; border-color: #0d0d0d; }\n\n\n\n  /* ---------- The CTA is the email input itself in every version;\n       hover blooms the shader. V1/V2: white pill. V3: black pill at\n       rest that flips white when the portal opens. ---------- */\n\n  .cta-label { display: none; }\n\n  .cta:not(.done) .cta-form {\n    opacity: 1;\n    transform: scale(1);\n    pointer-events: auto;\n    transition: none;\n  }\n\n  body:not(.v3) .cta {\n    background: #f6f6f7;\n    border-color: rgba(13, 13, 13, 0.15);\n  }\n\n  .cta {\n    cursor: default;\n    box-shadow: 0 10px 30px rgba(9, 9, 11, 0.18);\n  }\n\n  .cta.done .cta-done { opacity: 1; transform: scale(1); }\n\n  /* V3 rest: black pill, light input; colors swap when it opens white */\n  .cta-form input { transition: color 0.3s ease; }\n  .cta-send { transition: color 0.3s ease, background 0.3s ease, transform 0.4s var(--spring), filter 0.2s ease; }\n\n  body.v3:not(.open) .cta-form input { color: #f6f6f7; }\n  body.v3:not(.open) .cta-form input::placeholder { color: rgba(246, 246, 247, 0.5); }\n  body.v3:not(.open) .cta-send { background: #f6f6f7; color: #0d0d0d; }\n\n  /* ---------- V3: light mode with iOS chat bubbles ---------- */\n\n  body.v3 .wall.base { display: none; }\n\n  .bubbles {\n    position: fixed;\n    inset: 0;\n    z-index: 4;\n    pointer-events: none;\n    display: none;\n  }\n  body.v3 .bubbles { display: block; }\n\n  .bubble {\n    position: absolute;\n    display: flex;\n    align-items: flex-end;\n    gap: 8px;\n    max-width: 280px;\n    opacity: 0;\n    /* pop in (transform) + idle float (translate) run side by side:\n       the individual `translate` property never conflicts with scale() */\n    animation:\n      bubbleIn 0.55s var(--spring) both,\n      floaty calc(4.5s + var(--i) * 0.4s) ease-in-out infinite alternate;\n    animation-delay: calc(var(--i) * 0.06s + 0.1s), calc(var(--i) * -1.3s);\n  }\n\n  @keyframes bubbleIn {\n    from { opacity: 0; transform: scale(0); }\n    to   { opacity: 1; transform: scale(1); }\n  }\n\n  /* Luma-cover idle drift \u2014 a few px, desynced per bubble */\n  @keyframes floaty {\n    from { translate: 0 -3px; }\n    to   { translate: 0 4px; }\n  }\n\n  .msg {\n    box-shadow: 0 6px 18px rgba(11, 147, 246, 0.22), 0 2px 5px rgba(13, 13, 13, 0.06);\n  }\n  .avatar {\n    filter: drop-shadow(0 4px 8px rgba(13, 13, 13, 0.14));\n    /* individual `scale` transitions independently of the shake rotate */\n    transition: scale 0.35s var(--spring);\n  }\n\n  /* Hovering a bubble: its memoji grows and shakes */\n  .bubble { pointer-events: auto; }\n  body.open .bubble { pointer-events: none; }\n  .bubble:hover .avatar {\n    scale: 1.5;\n    animation: memojiShake 0.4s ease-in-out infinite;\n  }\n\n  @keyframes memojiShake {\n    0%, 100% { transform: rotate(-7deg); }\n    50%      { transform: rotate(7deg); }\n  }\n\n  /* Burst when the portal opens */\n  body.v3.open .bubble {\n    animation: bubbleBurst 0.32s ease-out both;\n    animation-delay: calc(var(--i) * 0.035s);\n  }\n\n  @keyframes bubbleBurst {\n    0%   { opacity: 1; transform: scale(1); }\n    55%  { opacity: 0.9; transform: scale(1.18); }\n    100% { opacity: 0; transform: scale(0.4); }\n  }\n\n  .avatar {\n    flex: none;\n    width: 54px;\n    height: 54px;\n  }\n  .avatar img {\n    width: 100%;\n    height: 100%;\n    object-fit: contain;\n    display: block;\n  }\n\n  .msg {\n    background: #0b93f6;\n    color: #fff;\n    font: 400 14px/1.4 \"Satoshi\", sans-serif;\n    letter-spacing: -0.1px;\n    padding: 9px 14px;\n    border-radius: 18px;\n    border-bottom-left-radius: 5px;\n  }\n\n  /* Scattered slots \u2014 irregular orbit around the hero */\n  .bubble:nth-child(1) { left: 13%;  top: 24%; }\n  .bubble:nth-child(2) { left: 33%;  top: 6%; }\n  .bubble:nth-child(3) { left: 3%;   top: 54%; }\n  .bubble:nth-child(4) { left: 12%;  top: 78%; }\n  .bubble:nth-child(5) { left: 36%;  bottom: 3%; }\n  .bubble:nth-child(6) { right: 5%;  top: 12%; }\n  .bubble:nth-child(7) { right: 3%;  top: 55%; }\n  .bubble:nth-child(8) { right: 13%; bottom: 9%; }\n\n  @media (max-width: 900px) {\n    .bubble:nth-child(2), .bubble:nth-child(3),\n    .bubble:nth-child(6), .bubble:nth-child(7) { display: none; }\n  }\n\n\n  /* ---------- Bottom fold fade, Luma-style ---------- */\n\n  .fold-fade {\n    position: fixed;\n    left: 0; right: 0; bottom: 0;\n    height: 20vh;\n    z-index: 6;\n    pointer-events: none;\n    background: linear-gradient(to top, #09090b 0%, rgba(9,9,11,0.6) 40%, rgba(9,9,11,0) 100%);\n  }\n\n  body:is(.v2, .v3) .fold-fade {\n    background: linear-gradient(to top, #f6f6f7 0%, rgba(246,246,247,0.6) 40%, rgba(246,246,247,0) 100%);\n  }\n\n  @media (prefers-reduced-motion: reduce) {\n    .row { animation: none; }\n    .bubble { animation: none; opacity: 1; }\n    .bubble:hover .avatar { scale: 1; animation: none; }\n    .reveal, .title-rest, .sub, .cta, .cta-label, .cta-form, .cta-done, .hero::before { transition-duration: 0.01s; }\n  }\n<\/style>\n<\/head>\n<body>\n\n  <!-- Dormant ticker wall -->\n  <div class=\"wall base\" id=\"wallBase\" aria-hidden=\"true\"><\/div>\n\n  <!-- Vivid reveal: shader canvas + magnified ticker wall, clipped to a circle -->\n  <div class=\"reveal\" aria-hidden=\"true\">\n    <canvas class=\"warp\" id=\"warp\"><\/canvas>\n    <div class=\"lens\">\n      <div class=\"wall vivid\" id=\"wallVivid\"><\/div>\n    <\/div>\n    <div class=\"lens-rim\"><\/div>\n  <\/div>\n\n  <header>\n    <div class=\"header-inner\">\n      <span class=\"brand\" aria-label=\"Autopilot\">\n        <img class=\"brand-logo\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKAAAACgCAYAAACLz2ctAABNxElEQVR42u19eZRdVZnvb+9z7nxvzZVUEmpISEI6ITNDWI0UEQRbn63IoEAvQBqnVlpGoZVuXYgMdoMt6gPbJzg+W3QB7YBASCQBSUJIkZBQEDLVkKlSc9Wt4Q7n7PdHzj6ee2pPNwbFfl1rZaWGe889Z+9vf8Pv+33fR/Df54t4/2hrayvWr1/PADiyFzc3N8fj8XiN4zjTXddtYIzNpJROJ4Q0OI5TTwipJoRUM8YqCCFJAAnXdWOEkCghxAJgM8YIABBCmOu6RUppkTFWAJAjhEwwxsYJISMAhgAMMMZ6CSFHXNftoZQeJIT0WJbVMzk5OdDZ2TmpeDartbWVAMD69etdAMz7999i0/6S7522trYShbDRpqam6dFotBnAyY7jzCeEzCGEtDDGGgghtYyxSkIIJeTYUhBCwNgf9pYQAtd1pTfBGPPfw68RfG/wesHvvf9dACOMsT4Ahwkhna7r7rMsazeAPblcrqu7u/uI9zqhUHrP7v6lCuRfmgDS1tZW6mmBkk1ZuHBhdGJiooUQsogQspwxtgTAKQAaKaUpSmmJYHGh8n7Hjn177AdPkLh2I4HXgRz7AmOs5HpBmQz+nRDCf2YCbU0opX94uMA9eu8fZ4x1AXiTELKDMfYqY+z1RCLR0d7enjddm/8RwBMjdE7wlDc1NVVHIpGlhJBVruueCWAxY6zZsiw7rGkYY4wQ4rJjX6CUEsYY4f+bajb+ffj6wb9PWeDQe8PX9u6NBQ4BF3LKhT+oWR3HKRJCOhljOxhjL1NKNxUKhW1dXV2DwY9tbW21/hKEkbyD74t6m+Iv4Lx58/7KcZz3AHgPIeQMQsi04KZ6/xxPC5GgpgkLiMo8ioQwLFTha4W0pNAky4RQJLDeaxghhAX+J4QQi997QJP3AHgFwDO \"LLY\",\"UNH\",\"JNJ\",\"PFE\",\"MRK\",\"ABBV\",\"TMO\",\"ISRG\",\"VRTX\",\"REGN\",\n    \"COST\",\"WMT\",\"HD\",\"MCD\",\"NKE\",\"SBUX\",\"DIS\",\"T\",\"VZ\",\"TMUS\",\n    \"SOFI\",\"HOOD\",\"RKLB\",\"IONQ\",\"MARA\",\"RIOT\",\"MSTR\",\"DKNG\",\"RBLX\",\"U\"\n  ];\n\n  function rand(min, max) { return Math.random() * (max - min) + min; }\n  function shuffle(a) {\n    for (let i = a.length - 1; i > 0; i--) {\n      const j = Math.floor(Math.random() * (i + 1));\n      [a[i], a[j]] = [a[j], a[i]];\n    }\n    return a;\n  }\n\n  // Build row data once so both walls match exactly\n  const ROWS = 14;\n  const PER_ROW = 12;\n  const rowData = [];\n  for (let r = 0; r < ROWS; r++) {\n    const picks = shuffle([...SYMBOLS]).slice(0, PER_ROW).map(sym => {\n      const up = Math.random() > 0.42;\n      const px = rand(8, 980).toFixed(2);\n      const chg = (up ? \"+\" : \"\\u2212\") + rand(0.1, 9.8).toFixed(2) + \"%\";\n      return { sym, px, chg, up };\n    });\n    rowData.push({ picks, dur: rand(70, 150).toFixed(0), rev: r % 2 === 1 });\n  }\n\n  function buildWall(el) {\n    rowData.forEach(({ picks, dur, rev }) => {\n      const row = document.createElement(\"div\");\n      row.className = \"row\" + (rev ? \" rev\" : \"\");\n      row.style.setProperty(\"--dur\", dur + \"s\");\n      // duplicate content for a seamless -50% loop\n      const half = picks.map(t =>\n        `<span class=\"tick\"><span class=\"sym\">${t.sym}<\/span><span class=\"px\">${t.px}<\/span><span class=\"chg ${t.up ? \"up\" : \"dn\"}\">${t.chg}<\/span><\/span>`\n      ).join(\"\");\n      row.innerHTML = half + half;\n      el.appendChild(row);\n    });\n  }\n\n  buildWall(document.getElementById(\"wallBase\"));\n  buildWall(document.getElementById(\"wallVivid\"));\n\n  // ---------- Bloom trigger: hover or focus opens; typing keeps it open ----------\n  const cta = document.getElementById(\"cta\");\n  const ctaForm = document.getElementById(\"ctaForm\");\n  const ctaEmail = document.getElementById(\"ctaEmail\");\n  const vividTicks = () => document.querySelectorAll(\"#wallVivid .tick\");\n  let hovering = false;\n  let cycleTimer = null;\n  let cyclePhase = 0;\n  let hiddenBatch = [];\n\n  const focusWithin = () => cta.contains(document.activeElement);\n\n  // Ticks whose center currently sits inside the visible circle \u2014\n  // rows drift, so this is recomputed each cycle step\n  function ticksInCircle() {\n    const cx = innerWidth * 0.5;\n    const cy = innerHeight * 0.52;\n    const r = 0.46 * Math.min(innerWidth, innerHeight) * 0.92;\n    const inside = [];\n    for (const el of vividTicks()) {\n      const b = el.getBoundingClientRect();\n      const dx = b.left + b.width / 2 - cx;\n      const dy = b.top + b.height / 2 - cy;\n      if (dx * dx + dy * dy < r * r) inside.push(el);\n    }\n    return inside;\n  }\n\n  function showAllTickers() {\n    for (const el of vividTicks()) {\n      el.style.transitionDelay = (Math.random() * 0.3).toFixed(2) + \"s\";\n      el.classList.add(\"on\");\n    }\n  }\n\n  function cycleStep() {\n    if (cyclePhase === 0) {\n      // hide a fresh handful inside the circle: blur out, then dissolve\n      const pool = ticksInCircle().filter(el => el.classList.contains(\"on\"));\n      hiddenBatch = shuffle(pool).slice(0, 5);\n      for (const el of hiddenBatch) {\n        el.style.transitionDelay = (Math.random() * 0.25).toFixed(2) + \"s\";\n        el.classList.add(\"bye\");\n        el.classList.remove(\"on\");\n      }\n    } else {\n      // bring them back before the next batch goes\n      for (const el of hiddenBatch) {\n        el.style.transitionDelay = (Math.random() * 0.25).toFixed(2) + \"s\";\n        el.classList.remove(\"bye\");\n        el.classList.add(\"on\");\n      }\n      hiddenBatch = [];\n    }\n    cyclePhase = 1 - cyclePhase;\n  }\n\n  function startCycle() {\n    showAllTickers();\n    cyclePhase = 0;\n    clearInterval(cycleTimer);\n    cycleTimer = setInterval(cycleStep, 1200);\n  }\n\n  function stopCycle() {\n    clearInterval(cycleTimer);\n    cycleTimer = null;\n    hiddenBatch = [];\n    for (const el of vividTicks()) {\n      el.style.transitionDelay = \"0s\";\n      el.classList.remove(\"on\", \"bye\");\n    }\n  }\n\n  function open() {\n    document.body.classList.add(\"open\");\n    startCycle();\n    warpStart();\n  }\n  function maybeClose() {\n    if (hovering || focusWithin()) return;\n    document.body.classList.remove(\"open\");\n    stopCycle();\n    warpStop();\n  }\n\n  cta.addEventListener(\"mouseenter\", () => { hovering = true; open(); });\n  cta.addEventListener(\"mouseleave\", () => { hovering = false; maybeClose(); });\n  cta.addEventListener(\"focusin\", open);\n  cta.addEventListener(\"focusout\", () => setTimeout(maybeClose, 0));\n\n  ctaForm.addEventListener(\"submit\", (e) => {\n    e.preventDefault();\n    if (!ctaEmail.value.trim()) { ctaEmail.focus(); return; }\n    cta.classList.add(\"done\");\n    ctaEmail.blur();\n  });\n\n  // ---------- Version switcher ----------\n  const swBtns = document.querySelectorAll(\".sw-btn\");\n  function setVersion(v) {\n    document.body.classList.toggle(\"v2\", v === \"2\");\n    document.body.classList.toggle(\"v3\", v === \"3\");\n    swBtns.forEach(b => b.classList.toggle(\"active\", b.dataset.v === v));\n  }\n  swBtns.forEach(btn => btn.addEventListener(\"click\", () => setVersion(btn.dataset.v)));\n\n  // Deep-linking for the header library: ?v=1|2|3 picks a version,\n  // &embed=1 hides the switcher for card previews\n  const params = new URLSearchParams(location.search);\n  const startV = params.get(\"v\") || window.__V || null;\n  if (startV === \"2\" || startV === \"3\") setVersion(startV);\n  if (params.get(\"embed\") || window.__EMBED || window.__HIDE_SW) {\n    document.body.classList.add(\"embed\");\n  }\n  if (params.get(\"embed\") || window.__EMBED) {\n    // Library preview demo: cycle the hover state so cards show both\n    // rest and open states unattended. Real hovers still take priority\n    // (maybeClose defers while hovering or focused). Only V3 auto-demos.\n    if (startV === \"3\") {\n      setTimeout(() => {\n        setInterval(() => {\n          if (document.body.classList.contains(\"open\")) {\n            maybeClose();\n          } else if (!hovering) {\n            open();\n          }\n        }, 2800);\n      }, 800 + Math.random() * 1500);\n    }\n  }\n\n  // ---------- Speed-lines shader (WebGL port of the R3F reference) ----------\n  const canvas = document.getElementById(\"warp\");\n  const gl = canvas.getContext(\"webgl\", { antialias: false });\n  const reduceMotion = window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n  let raf = null;\n  let stopTimer = null;\n  let uTime, uRes, uCenter;\n  const t0 = performance.now();\n\n  const FRAG = `\nprecision highp float;\n\nuniform vec3 uResolution;\nuniform float uTime;\nuniform vec2 uCenter;\n\nfloat randVal(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }\n\nfloat noise2d(vec2 p){\n    vec2 i = floor(p);\n    vec2 f = fract(p);\n    vec2 u = f*f*(3.0-2.0*f);\n    float a = randVal(i + vec2(0.0, 0.0));\n    float b = randVal(i + vec2(1.0, 0.0));\n    float c = randVal(i + vec2(0.0, 1.0));\n    float d = randVal(i + vec2(1.0, 1.0));\n    return (a + (b-a)*u.x + (c-a)*u.y + (a-b-c+d)*u.x*u.y) / 4.0;\n}\n\nfloat mirrored(float t, float shift){\n    t = fract(t + shift);\n    return 2.0*abs(t-0.5);\n}\n\nfloat radialLayer(float angle, float radius){\n    const float SCALE = 45.0;\n    radius = pow(radius, 0.01);\n    float offset = -uTime * 0.07;\n    vec2 pos = vec2(mirrored(angle, 0.1), radius + offset);\n    float n1 = noise2d(pos * SCALE);\n    pos = 2.1*vec2(mirrored(angle,0.4), radius+offset);\n    float n2 = noise2d(pos * SCALE);\n    pos = 3.7*vec2(mirrored(angle,0.8), radius+offset);\n    float n3 = noise2d(pos * SCALE);\n    pos = 5.8*vec2(mirrored(angle,0.0), radius+offset);\n    float n4 = noise2d(pos * SCALE);\n    return pow((n1 + 0.5*n2 + 0.25*n3 + 0.125*n4) * 3.0, 1.0);\n}\n\nvec3 applyColor(float v){\n    v = clamp(v, 0.0, 1.0);\n    vec3 col = mix(vec3(0.0,0.0,1.1), vec3(0.0,1.0,1.0), v);\n    col = mix(col, vec3(1.0,1.0,1.0), v*4.0-3.0) * v;\n    col = max(col, vec3(0.0));\n    col = mix(col, vec3(1.0, 0.25, 1.0), smoothstep(1.0, 0.2, v) * smoothstep(0.15, 0.9, v));\n    return col;\n}\n\nvoid main(){\n    vec2 uv = (gl_FragCoord.xy - uCenter) / uResolution.y;\n    float dist = dot(uv, uv);\n    float ang = atan(uv.y, uv.x) / 6.28318530718;\n    float val = radialLayer(ang, dist);\n    val = val * 2.5 - 1.4;\n    val = mix(0.0, val, 0.8 * smoothstep(0.0, 0.8, dist));\n    gl_FragColor = vec4(applyColor(val), 1.0);\n}`;\n\n  const VERT = `\nattribute vec2 aPos;\nvoid main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`;\n\n  function compile(type, src) {\n    const s = gl.createShader(type);\n    gl.shaderSource(s, src);\n    gl.compileShader(s);\n    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {\n      console.error(gl.getShaderInfoLog(s));\n      return null;\n    }\n    return s;\n  }\n\n  if (gl) {\n    const prog = gl.createProgram();\n    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));\n    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));\n    gl.linkProgram(prog);\n    gl.useProgram(prog);\n\n    // fullscreen triangle\n    const buf = gl.createBuffer();\n    gl.bindBuffer(gl.ARRAY_BUFFER, buf);\n    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);\n    const loc = gl.getAttribLocation(prog, \"aPos\");\n    gl.enableVertexAttribArray(loc);\n    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);\n\n    uTime = gl.getUniformLocation(prog, \"uTime\");\n    uRes = gl.getUniformLocation(prog, \"uResolution\");\n    uCenter = gl.getUniformLocation(prog, \"uCenter\");\n  }\n\n  function resize() {\n    const dpr = Math.min(window.devicePixelRatio || 1, 2);\n    canvas.width = Math.floor(innerWidth * dpr);\n    canvas.height = Math.floor(innerHeight * dpr);\n    if (!gl) return;\n    gl.viewport(0, 0, canvas.width, canvas.height);\n    gl.uniform3f(uRes, canvas.width, canvas.height, 1);\n    // clip-path anchor is 50% / 52% from the top; gl_FragCoord is bottom-up\n    gl.uniform2f(uCenter, canvas.width * 0.5, canvas.height * (1 - 0.52));\n  }\n  window.addEventListener(\"resize\", resize);\n  if (gl) { resize(); draw(0); }  // pre-warm: compile + first draw at load\n\n  function draw(t) {\n    gl.uniform1f(uTime, t);\n    gl.drawArrays(gl.TRIANGLES, 0, 3);\n  }\n\n  function frame() {\n    draw((performance.now() - t0) * 0.001);\n    raf = requestAnimationFrame(frame);\n  }\n\n  function warpStart() {\n    if (!gl) return;\n    clearTimeout(stopTimer);\n    if (reduceMotion) { draw(10); return; }   // static frame\n    if (!raf) raf = requestAnimationFrame(frame);\n  }\n\n  function warpStop() {\n    // keep animating through the collapse, then halt\n    stopTimer = setTimeout(() => {\n      if (raf) cancelAnimationFrame(raf);\n      raf = null;\n    }, 1000);\n  }\n<\/script>\n<\/body>\n<\/html>\n";

  const OWNER_KEY = "headerLibrary.owner";

  const NAMES_KEY = "headerLibrary.names";

  function loadNames() {
    try { return JSON.parse(localStorage.getItem(NAMES_KEY)) || {}; }
    catch { return {}; }
  }
  function loadOrder() {
    try { return JSON.parse(localStorage.getItem(ORDER_KEY)) || []; }
    catch { return []; }
  }
  // keys hidden by the current filter keep their saved order behind the visible ones
  function saveOrder(visibleKeys) {
    const rest = loadOrder().filter((k) => !visibleKeys.includes(k));
    try { localStorage.setItem(ORDER_KEY, JSON.stringify([...visibleKeys, ...rest])); } catch {}
  }

  function saveName(v, title) {

  // ---------- IndexedDB uploads (videos don't fit in localStorage) ----------
  function idb() {
    return new Promise((res, rej) => {
      const req = indexedDB.open("zoePlayground", 1);
      req.onupgradeneeded = () =>
        req.result.createObjectStore("uploads", { keyPath: "id", autoIncrement: true });
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  }
  async function idbAll() {
    const db = await idb();
    return new Promise((res, rej) => {
      const req = db.transaction("uploads").objectStore("uploads").getAll();
      req.onsuccess = () => res(req.result || []);
      req.onerror = () => rej(req.error);
    });
  }
  async function idbAdd(rec) {
    const db = await idb();
    return new Promise((res, rej) => {
      const tx = db.transaction("uploads", "readwrite");
      tx.objectStore("uploads").add(rec);
      tx.oncomplete = res;
      tx.onerror = () => rej(tx.error);
    });
  }
  async function idbDel(id) {
    const db = await idb();
    return new Promise((res, rej) => {
      const tx = db.transaction("uploads", "readwrite");
      tx.objectStore("uploads").delete(id);
      tx.oncomplete = res;
      tx.onerror = () => rej(tx.error);
    });
  }
  async function idbUpdate(rec) {
    const db = await idb();
    return new Promise((res, rej) => {
      const tx = db.transaction("uploads", "readwrite");
      tx.objectStore("uploads").put(rec);
      tx.oncomplete = res;
      tx.onerror = () => rej(tx.error);
    });
  }
  // one-time migration of old localStorage uploads
  async function migrate() {
    let legacy = [];
    try { legacy = JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch {}
    if (!legacy.length) return;
    for (const u of legacy) {
      await idbAdd({ title: u.title, cat: u.cat || "web", kind: "html", data: u.src });
    }
    localStorage.removeItem(STORE_KEY);
  }

  // ---------- Clipboard + toast ----------
  let toastEl = null;

  function showToast(msg) {
    if (!toastEl) {
      toastEl = document.createElement("div");
      toastEl.className = "toast";
      toastEl.setAttribute("role", "status");
      document.body.appendChild(toastEl);

  async function copyCode(code, title) {
    try {
      await navigator.clipboard.writeText(code);
    } catch {
      // clipboard API needs a secure context; fall back to a scratch textarea
      const ta = document.createElement("textarea");
      ta.value = code;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch {}
      ta.remove();
      if (!ok) { showToast("Couldn't copy \u2014 try again"); return; }
    }
    showToast(`Copied \u201c${title}\u201d to clipboard`);
  }

    codeInput.value = "";

    const reader = new FileReader();
    reader.onload = async () => {
      rec.code = reader.result;

  function makeCard({ key, title, tag, previewSrc, zoom, code, copyLabel, index, removable, onRemove, onRename, onAttachCode }) {
    const card = document.createElement("div");
    card.className = "card" + (removable ? " card-removable" : "");
    card.dataset.key = key;
    card.draggable = editing;
    card.innerHTML = `
      <div class="card-title">
        <h2 spellcheck="false"></h2>
        <span class="card-tag"></span>
        <span class="card-actions">
          ${code ? `<button class="card-copy" type="button">${copyLabel || "Copy code"}</button>` : ""}
          ${onAttachCode ? `<button class="card-attach" type="button">${code ? "Replace code" : "Add code"}</button>` : ""}
          ${removable ? '<button class="card-remove" type="button">Remove</button>' : ""}
        </span>
      </div>
      <div class="preview">
        <iframe loading="lazy"></iframe>
      </div>`;
    const h2 = card.querySelector("h2");
    h2.textContent = title;

    // click the title to edit; Enter or blur commits, Escape reverts
    h2.addEventListener("click", () => {
      if (!onRename || h2.isContentEditable) return;
      h2.contentEditable = "plaintext-only" in h2 ? "plaintext-only" : "true";
      h2.focus();
      const range = document.createRange();
      range.selectNodeContents(h2);
      const sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    });
    h2.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); h2.blur(); }
      if (e.key === "Escape") { h2.textContent = title; h2.blur(); }
    });
    h2.addEventListener("blur", () => {
      h2.contentEditable = "false";
      const next = h2.textContent.trim();
      if (!next || next === title) { h2.textContent = title; return; }
      onRename(next);
    });

    card.querySelector(".card-tag").textContent = tag;
    if (code) {
      card.querySelector(".card-copy").addEventListener("click", (e) => {
        e.stopPropagation();
        copyCode(code, title);
      });
    }
    if (onAttachCode) {
      card.querySelector(".card-attach").addEventListener("click", (e) => {
        e.stopPropagation();
        onAttachCode();
      });
    }
    if (removable) {
      card.querySelector(".card-remove").addEventListener("click", onRemove);
    }
    bindDrag(card);
    const preview = card.querySelector(".preview");
    if (zoom && zoom !== 1) preview.dataset.zoom = zoom;
    if (previewSrc.kind === "video") {
      preview.innerHTML = '<video muted loop playsinline></video>';
      const vid = preview.querySelector("video");
      vid.src = previewSrc.url;
      if (previewSrc.autoplay) {
        vid.autoplay = true;
        vid.play().catch(() => {});
      } else {
        // rest on the first frame; play while hovered
        card.addEventListener("mouseenter", () => vid.play().catch(() => {}));
        card.addEventListener("mouseleave", () => { vid.pause(); vid.currentTime = 0; });
      }
      card.addEventListener("click", (e) => {
        if (editing || e.target.closest("h2, .card-remove")) return;
        openDetail(index);
      });
    } else {
      const frame = preview.querySelector("iframe");
      // a public link loads straight into the frame; local files use srcdoc
      if (previewSrc.kind === "link") frame.src = previewSrc.url;
      else frame.srcdoc = previewSrc.srcdoc;
      frameIndex.set(frame, index);
    }
    return card;
  }

  async function render() {
    grid.innerHTML = "";
    visibleItems = [];

    const names = loadNames();
    const uploads = await idbAll();
    const entries = [];

    for (const h of HEADERS) {
      if (!matchesFilter(h.cat)) continue;
      const title = names[h.v] || h.title;
      entries.push({
        key: "h:" + h.v,
        title,
        tag: h.tag,
        item: { title, type: "html", src: heroFor(h.v, "detail") },
        code: heroFor(h.v, "detail"),
        previewSrc: { kind: "html", srcdoc: heroFor(h.v, "embed") },
        removable: false,
        onRename: (next) => { saveName(h.v, next); render(); },
      });
    }

    // cards baked into the file at publish time: visible to everyone, not editable
    (window.BAKED || []).forEach((b, n) => {
      if (!matchesFilter(b.cat)) return;
      const isVideo = b.kind === "video";
      const isLink = b.kind === "link";
      entries.push({
        key: "b:" + n,
        title: b.title,
        tag: b.cat[0].toUpperCase() + b.cat.slice(1),
        zoom: b.cat === "component" ? 2 : 1,
        item: { title: b.title, type: b.kind, src: b.data },
        code: isLink || !isVideo ? b.data : (b.code || null),
        copyLabel: isLink ? "Copy link" : "Copy code",
        previewSrc: isLink
          ? { kind: "link", url: b.data }
          : isVideo
          ? { kind: "video", url: b.data, autoplay: b.autoplay !== false }
          : { kind: "html", srcdoc: b.data },
        removable: false,
        onRename: null,
      });
    });

    for (const u of uploads) {
      if (!matchesFilter(u.cat)) continue;
      const isVideo = u.kind === "video";
      const isLink = u.kind === "link";
      const cat = u.cat || "web";
      entries.push({
        key: "u:" + u.id,
        title: u.title,
        tag: cat[0].toUpperCase() + cat.slice(1),
        zoom: cat === "component" ? 2 : 1,
        item: {
          title: u.title,
          type: u.kind,
          src: isLink ? u.url : isVideo ? videoURL(u) : u.data,
        },
        // recordings carry no source of their own, but one can be attached
        code: isLink ? u.url : isVideo ? (u.code || null) : u.data,
        copyLabel: isLink ? "Copy link" : "Copy code",
        onAttachCode: isVideo ? () => attachCode(u) : null,
        previewSrc: isLink
          ? { kind: "link", url: u.url }
          : isVideo
          ? { kind: "video", url: videoURL(u), autoplay: u.autoplay !== false }
          : { kind: "html", srcdoc: u.data },
        removable: true,
        onRemove: async () => { await idbDel(u.id); render(); },
        onRename: async (next) => { u.title = next; await idbUpdate(u); render(); },
      });
    }

    // saved arrangement wins; anything new (never dragged) keeps its default slot at the end
    const order = loadOrder();
    entries.sort((a, b) => {
      const ia = order.indexOf(a.key);
      const ib = order.indexOf(b.key);
      if (ia === ib) return 0;
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    });

    entries.forEach((e, index) => {
      visibleItems.push(e.item);
      grid.appendChild(makeCard({ ...e, index }));
    });

    fitPreviews();
    requestAnimationFrame(fitPreviews);
  }

  // ---------- Edit mode: rearrange cards, Remove buttons ----------
  let editing = false;
  let dragCard = null;

  function setEditing(on) {
    editing = on && isOwner;
    on = editing;
    document.body.classList.toggle("editing", on);
    const btn = document.getElementById("libEdit");
    btn.textContent = on ? "Done" : "Edit";
    btn.classList.toggle("on", on);
    grid.querySelectorAll(".card").forEach((c) => { c.draggable = on; });
  }

  function bindDrag(card) {
    card.addEventListener("dragstart", (e) => {
      if (!editing) { e.preventDefault(); return; }
      dragCard = card;
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", card.dataset.key);
    });
    card.addEventListener("dragend", () => {
      card.classList.remove("dragging");
      dragCard = null;
      // DOM order is the new order; re-render so pager indices follow the cards
      saveOrder([...grid.children].map((c) => c.dataset.key));
      render();
    });
  }

  // first card whose left half the pointer has not yet passed, scanning row by row
  function cardBefore(x, y) {
    for (const c of grid.querySelectorAll(".card:not(.dragging)")) {
      const r = c.getBoundingClientRect();
      if (y < r.bottom && x < r.left + r.width / 2) return c;
    }
    return null;
  }

  grid.addEventListener("dragover", (e) => {
    if (!dragCard) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    const before = cardBefore(e.clientX, e.clientY);
    if (before !== dragCard) {
      if (before) grid.insertBefore(dragCard, before);
      else grid.appendChild(dragCard);
    }
  });
  grid.addEventListener("drop", (e) => e.preventDefault());

  document.getElementById("libEdit").addEventListener("click", () => setEditing(!editing));

  // ---------- Export ----------
  // Saves every card back out as its own file, so the originals exist on disk again.
  const EXT = {
    "video/webm": "webm",
    "video/mp4": "mp4",
    "video/quicktime": "mov",
    "text/html": "html",
  };

  function slug(name) {
    return (name || "untitled").trim().replace(/[\\/:*?"<>|]+/g, "-").slice(0, 80);
  }

  function saveBlob(blob, filename) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 8000);
  }

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  document.getElementById("libExport").addEventListener("click", async () => {
    const recs = await idbAll();
    const links = [];
    let saved = 0;

    // baked-in cards export too, so a published copy can be unpacked
    const all = (window.BAKED || []).map((b) => ({
      title: b.title, kind: b.kind, data: b.data, mime: b.kind === "video" ? "" : "text/html",
    })).concat(recs);

    if (!all.length) { showToast("Nothing to export yet"); return; }
    showToast(`Exporting ${all.length} cards\u2026`);

    for (const u of all) {
      if (u.kind === "link") { links.push(`${u.title}\t${u.url || u.data}`); continue; }

      if (u.kind === "video") {
        let blob;
        if (typeof u.data === "string") {
          blob = await (await fetch(u.data)).blob();       // baked: data URL
        } else {
          blob = new Blob([u.data], { type: u.mime || "video/mp4" });
        }
        saveBlob(blob, `${slug(u.title)}.${EXT[blob.type] || "mp4"}`);
      } else {
        saveBlob(new Blob([u.data], { type: "text/html" }), `${slug(u.title)}.html`);
      }
      saved++;
      await wait(350);   // browsers throttle rapid-fire downloads
    }

    if (links.length) {
      saveBlob(new Blob([links.join("\n")], { type: "text/plain" }), "links.txt");
    }
    showToast(`Exported ${saved} file${saved === 1 ? "" : "s"}`);
  });

  // ---------- Publish ----------
  // Writes a copy of this page with every local card baked in, so visitors see
  // the same library without needing anything in their own browser storage.
  function bufToDataURL(buf, mime) {
    const bytes = new Uint8Array(buf);
    let bin = "";
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return `data:${mime};base64,${btoa(bin)}`;
  }

  document.getElementById("libPublish").addEventListener("click", async () => {
    showToast("Packing the library\u2026");
    const recs = await idbAll();
    const baked = (window.BAKED || []).slice();

    for (const u of recs) {
      const entry = { title: u.title, cat: u.cat || "web", kind: u.kind };
      if (u.kind === "video") {
        entry.data = bufToDataURL(u.data, u.mime || "video/mp4");
        entry.autoplay = u.autoplay !== false;
        if (u.code) entry.code = u.code;
      } else if (u.kind === "link") {
        entry.data = u.url;
      } else {
        entry.data = u.data;
      }
      baked.push(entry);
    }

    // start from the live document, then undo anything this session added
    const clone = document.documentElement.cloneNode(true);
    clone.querySelector("#grid").innerHTML = "";
    clone.querySelectorAll(".toast, .balloon-overlay, #bakedData").forEach((n) => n.remove());
    const body = clone.querySelector("body");
    body.className = "";

    const data = clone.ownerDocument.createElement("script");
    data.id = "bakedData";
    data.textContent = "window.BAKED = " +
      JSON.stringify(baked).replace(/<\//g, "<\\/") + ";";
    clone.querySelector("head").appendChild(data);

    const html = "<!DOCTYPE html>\n" + clone.outerHTML;
    const mb = (html.length / 1048576).toFixed(1);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
    a.download = "index.html";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    showToast(`index.html ready \u2014 ${baked.length} cards, ${mb} MB`);
  });
  addEventListener("keydown", (e) => { if (e.key === "Escape" && editing) setEditing(false); });

  const addMenu = document.getElementById("addMenu");
  const addUrl = document.getElementById("addUrl");

  function closeAddMenu() { addMenu.hidden = true; }

  document.getElementById("libAdd").addEventListener("click", (e) => {
    e.stopPropagation();
    addMenu.hidden = !addMenu.hidden;
    if (!addMenu.hidden) { addUrl.value = ""; addUrl.focus(); }
  });
  addMenu.addEventListener("click", (e) => e.stopPropagation());
  document.addEventListener("click", closeAddMenu);
  addEventListener("keydown", (e) => { if (e.key === "Escape") closeAddMenu(); });

  document.getElementById("addFile").addEventListener("click", () => {
    closeAddMenu();
    fileInput.click();
  });

  document.getElementById("addLink").addEventListener("click", addLink);
  addUrl.addEventListener("keydown", (e) => { if (e.key === "Enter") addLink(); });

  async function addLink() {
    const raw = addUrl.value.trim();
    if (!raw) return;
    let url;
    try {
      url = new URL(/^https?:\/\//i.test(raw) ? raw : "https://" + raw);
    } catch {
      showToast("That doesn't look like a link");
      return;
    }
    closeAddMenu();
    // last meaningful path segment reads better than the bare host
    const seg = url.pathname.split("/").filter(Boolean).pop();
    const guess = (seg || url.hostname).replace(/[-_]/g, " ");
    const title = (prompt("Title", guess) || guess).trim();
    let cat = (prompt("Category: web / component / interaction", "web") || "web")
      .trim().toLowerCase();
    if (!["web", "component", "interaction"].includes(cat)) cat = "web";
    await idbAdd({ title, cat, kind: "link", url: url.href, mime: "text/uri-list" });
    render();
    showToast(`Added \u201c${title}\u201d`);
  }

  // browsers sometimes hand over an empty file.type for local videos
  function guessVideoMime(name) {
    if (/\.webm$/i.test(name)) return "video/webm";
    if (/\.mp4$/i.test(name)) return "video/mp4";
    return "video/quicktime";
  }

  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    fileInput.value = "";
    if (!file) return;
    const isVideo = /\.(mov|mp4|webm)$/i.test(file.name) || file.type.startsWith("video/");
    const reader = new FileReader();
    reader.onload = async () => {
      let cat = (prompt("Category: web / component / interaction", "web") || "web")
        .trim().toLowerCase();
      if (!["web", "component", "interaction"].includes(cat)) cat = "web";
      const autoplay = confirm("Autoplay the preview in the library?\n\nOK = autoplay \u00b7 Cancel = play on hover");
      await idbAdd({
        title: file.name.replace(/\.(html?|mov|mp4|webm)$/i, ""),
        cat,
        autoplay,
        kind: isVideo ? "video" : "html",
        mime: isVideo ? (file.type || guessVideoMime(file.name)) : "text/html",
        data: reader.result,
      });
      render();
    };
    if (isVideo) reader.readAsArrayBuffer(file);
    else reader.readAsText(file);
  });

  // Scale each 1440x900 iframe to fit its preview box
  function fitPreviews() {
    document.querySelectorAll(".preview").forEach((box) => {
      const frame = box.querySelector("iframe");
      if (!frame) return;
      const zoom = Number(box.dataset.zoom || 1);
      const s = (box.clientWidth / 1440) * zoom;
      if (zoom === 1) { frame.style.transform = `scale(${s})`; return; }
      // punched in: re-centre the 1440x900 frame on the box
      const ox = (box.clientWidth - 1440 * s) / 2;
      const oy = (box.clientHeight - 900 * s) / 2;
      frame.style.transform = `translate(${ox}px, ${oy}px) scale(${s})`;
    });
  }
  window.addEventListener("resize", fitPreviews);

  migrate().then(render);
  // ---------- Balloon: avatar click spawns the pop toy as an overlay ----------

    if (!ov) return;
    balloonOverlay = null;
    ov.classList.remove("in");
    setTimeout(() => ov.remove(), 380);
    resetIdle();
  }

  document.querySelector(".lib-avatar-wrap").addEventListener("click", openBalloon);
  addEventListener("keydown", (e) => { if (e.key === "Escape") closeBalloon(); });
  addEventListener("message", (e) => {
    if (e.data === "balloon-popped" && balloonOverlay) {
      balloonOverlay.classList.add("popped");
      setTimeout(closeBalloon, 2600);   // let the shards and string fall first
    }
  });

  // Idle: 30s of nothing on the library page and the balloon drifts in on its own
  const IDLE_MS = 30000;
  let idleTimer = null;

  function resetIdle() {
    clearTimeout(idleTimer);
    if (balloonOverlay || document.hidden || editing) return;   // already up, backgrounded, or rearranging
    idleTimer = setTimeout(openBalloon, IDLE_MS);
  }

  // capture: true so activity inside the header, cards and filters all count
  ["pointermove", "pointerdown", "keydown", "wheel", "scroll", "touchstart", "focusin"]
    .forEach(ev => addEventListener(ev, resetIdle, { passive: true, capture: true }));
  addEventListener("visibilitychange", resetIdle);
  addEventListener("blur", resetIdle);    // clicking into a preview iframe counts too
  resetIdle();
</script>


</body></html>
