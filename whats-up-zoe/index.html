<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>what's up zoe</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f6;color:#101010;font-family:Arial,Helvetica,sans-serif}main{min-height:100svh;display:grid;place-content:center;text-align:center;padding:32px}.greeting{display:flex;align-items:center;justify-content:center;gap:16px}h1{font-size:clamp(28px,5vw,48px);letter-spacing:-.05em;font-weight:500;margin:0}button{font:inherit}.head{position:relative;border:0;padding:0;background:none;cursor:pointer;border-radius:50%;flex:none}.head img{width:64px;height:64px;display:block;border-radius:50%;animation:shake 2.6s ease-in-out infinite}.head:hover img{animation:shake .4s ease-in-out infinite}.head:focus-visible{outline:3px solid #087bfa;outline-offset:6px}.hello{position:absolute;top:calc(100% + 18px);left:50%;transform:translate(-50%,5px);color:#087bfa;white-space:nowrap;font-size:16px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}.head:hover .hello,.head:focus-visible .hello{opacity:1;transform:translate(-50%,0)}@keyframes shake{0%,40%,100%{transform:rotate(-7deg)}20%,60%{transform:rotate(7deg)}80%{transform:rotate(0)}}@media(prefers-reduced-motion:reduce){.head img,.head:hover img{animation:none}*{transition:none!important}} 
  .balloon-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(245, 245, 246, 0.55);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .balloon-overlay.in { opacity: 1; }

  .balloon-overlay iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: transparent;
  }

  .balloon-hint {
    position: absolute;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%);
    font: 400 13px/1 "Satoshi", sans-serif;
    letter-spacing: -0.1px;
    color: rgba(13, 13, 13, 0.45);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease 0.9s;
  }
  .balloon-overlay.in .balloon-hint { opacity: 1; }
  .balloon-overlay.popped .balloon-hint { opacity: 0; transition-delay: 0s; }

  .balloon-close {
    position: absolute;
    top: 20px;
    right: 24px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(13, 13, 13, 0.14);
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #0d0d0d;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: transform 0.45s cubic-bezier(0.32, 1.28, 0.32, 1), background 0.2s ease;
  }
  .balloon-close:hover { transform: scale(1.08); background: #fff; }
